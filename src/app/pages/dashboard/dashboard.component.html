<div class="dashboard-container" [class.light-theme]="!isDarkMode">

    <aside class="sidebar">
        <div class="logo-area">
            <img src="/LOGO_ZORA.png" alt="Zora Logo">
            <span>ZORA</span>
        </div>

        <nav class="menu">
            <a href="#" class="active">Dashboard</a>
            <a href="#">Transações</a>
            <a href="#">Relatórios</a>
            <a href="#">Configurações</a>
        </nav>

        <div class="sidebar-footer">
            <button class="btn-theme" (click)="toggleTheme()">
                {{ isDarkMode ? '☀️ Modo Claro' : '🌙 Modo Escuro' }}
            </button>
            <button class="btn-logout" (click)="logout()">SAIR</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Olá, <span>{{userName}}</span>! 👋</h1>
            <p>Aqui está o resumo da sua vida financeira hoje.</p>
        </header>

        <section class="stats-grid">
            <div class="card balance">
                <label>Saldo Total</label>
                <h2>R$ 12.450,00</h2>
                <span class="trend up">▲ 12% este mês</span>
            </div>

            <div class="card income">
                <label>Receitas</label>
                <h2>R$ 8.200,00</h2>
            </div>

            <div class="card expenses">
                <label>Despesas</label>
                <h2>R$ 3.750,00</h2>
            </div>
        </section>

        <section class="dashboard-details">
            <div class="card chart-placeholder">
                <h3>Fluxo de Caixa</h3>
                <div class="dummy-chart">
                    <p>Gráfico em desenvolvimento...</p>
                </div>
            </div>

            <div class="card transactions">
                <div class="card-header">
                    <h3>Linha do Tempo</h3>
                    <button class="btn-nova" (click)="openTransactionModal()">+ Nova Transação</button>
                </div>

                <div class="filters">
                    <select>
                        <option>Mês/Ano</option>
                        <option>Junho 2026</option>
                    </select>
                    <select>
                        <option>Tipo</option>
                        <option>Receita</option>
                        <option>Despesa</option>
                    </select>
                    <select>
                        <option>Categoria</option>
                        <option>Alimentação</option>
                        <option>Salário</option>
                    </select>
                </div>

                <div class="transaction-list">
                    <div class="t-item">
                        <span class="icon">🛒</span>
                        <div class="info">
                            <strong>Supermercado</strong>
                            <small>Hoje, 14:30</small>
                        </div>
                        <span class="value negative">- R$ 342,00</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div class="modal-overlay" *ngIf="isTransactionModalOpen">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova Transação</h2>
                <button class="btn-close" (click)="closeTransactionModal()">✖</button>
            </div>

            <form (ngSubmit)="salvarTransacao()" #transacaoForm="ngForm">

                <div class="input-row">
                    <div class="input-group">
                        <label>Tipo de Movimentação</label>
                        <select name="tipo" required>
                            <option value="1">Receita</option>
                            <option value="2">Despesa</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Categoria</label>
                        <select name="categoria" required>
                            <option value="1">Alimentação</option>
                            <option value="2">Moradia</option>
                            <option value="3">Salário</option>
                        </select>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Valor (R$)</label>
                        <input type="number" name="valor" min="0.01" step="0.01" required placeholder="0,00">
                    </div>
                    <div class="input-group">
                        <label>Data</label>
                        <input type="date" name="data" [max]="hoje" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Descrição</label>
                    <input type="text" name="descricao" maxlength="255" required
                        placeholder="Ex: Compra do mês no Atacadão">
                </div>

                <button type="submit" class="btn-primary" [disabled]="transacaoForm.invalid">Lançar Transação</button>
            </form>
        </div>
    </div>
</div>
