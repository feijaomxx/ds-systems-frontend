<div class="login-container">

    <div class="left-panel">
        <img src="/LOGO_ZORA.png" alt="Zora Logo" class="logo-zora-topo">

        <div class="hero-content">
            <h1>Hora de transformar suas<br>finanças.</h1>

            <div class="illustration-area">
                <img src="/ilustracao-login.png" alt="Ilustração Financeira" class="hero-image">
            </div>

            <p>Como um novo amanhecer, o Zora traz luz e clareza para a sua vida financeira. Deixe a obscuridade para trás e assuma o controle absoluto do seu futuro hoje mesmo.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-card">

            <div class="toggle-container">
                <div class="toggle-switch" (click)="isLoginMode = !isLoginMode">
                    <div class="slider" [class.cadastro-active]="!isLoginMode"></div>
                    <span class="toggle-text" [class.active]="isLoginMode">ENTRAR</span>
                    <span class="toggle-text" [class.active]="!isLoginMode">CADASTRAR</span>
                </div>
            </div>

            <form (ngSubmit)="onSubmit()" #authForm="ngForm">

                <ng-container *ngIf="!isLoginMode">
                    <div class="cadastro-fields">
                        <div class="input-group">
                            <input type="text" name="nome" [(ngModel)]="usuario.nome" required
                                placeholder="Nome Completo">
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <input type="text" name="cpf" [(ngModel)]="usuario.cpf" required placeholder="CPF">
                            </div>
                            <div class="input-group">
                                <input type="text" name="rg" [(ngModel)]="usuario.rg" required placeholder="RG">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <input type="text" name="telefone" [(ngModel)]="usuario.telefone" required
                                    placeholder="Telefone">
                            </div>
                            <div class="input-group">
                                <input type="number" name="renda" [(ngModel)]="usuario.rendaMensal" required
                                    placeholder="Renda Mensal (R$)">
                            </div>
                        </div>
                    </div>
                </ng-container>

                <div class="input-group">
                    <input type="email" name="email" [(ngModel)]="usuario.email" required placeholder="Seu email">
                </div>

                <div class="input-group">
                    <input type="password" name="senha" [(ngModel)]="usuario.senha" required placeholder="Senha">
                </div>

                <button type="submit" class="btn-primary" [disabled]="authForm.invalid">
                    {{ isLoginMode ? 'ENTRAR' : 'CADASTRAR' }}
                </button>

            </form>
        </div>
    </div>
</div>
